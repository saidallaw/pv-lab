<style>
/* Layout: one-screen instrument console — control rail | module stage | meters & curves. Always dark. */
:root{
  --bg:#071110; --panel:#0D1A19; --panel2:#12231F; --panel3:#18302B; --ink:#E8F0EE; --muted:#8AA39E; --line:#1F3330;
  --accent:#2BB3A3; --volt:#5EA8FF; --amp:#3DDC97; --pwr:#F0B429; --diode:#FF8A3D; --hot:#FF5D4F; --ok:#3fc07a; --warn:#FFB020;
  --c-topcon:#2BB3A3; --c-hjt:#b388ff; --c-cdte:#e39a5c; --c-custom:#4fd1c5;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
canvas{direction:ltr}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45;margin:0;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:16px;font-weight:600;white-space:nowrap}
h2{font-size:13.5px;font-weight:600}
h3{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;max-width:1920px;margin:0 auto}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.bar .logo{display:flex;align-items:center;gap:8px}
.bar .logo img{width:30px;height:30px;border-radius:7px;display:block}
.bar .logo .brand{display:flex;flex-direction:column;line-height:1.15}
.bar .logo .credit{font-size:10.5px;color:var(--muted);white-space:nowrap}
.bar .logo .credit b{color:#F0B429;font-weight:600;letter-spacing:.08em}
.foot{font-size:11px;color:var(--muted);text-align:center;padding:6px}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);border-radius:7px;font-family:var(--f-display);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel3)}
.chipsTech{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.tchip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
.tchip b{font-size:10px;letter-spacing:.07em;color:var(--tc);text-transform:uppercase}
.tchip span{font-size:11.5px;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.tchip[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--panel2))}
.tchip.add{border-style:dashed;justify-content:center;color:var(--c-custom)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.main{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(400px,0.95fr);gap:8px;min-height:0}
.main.wide{grid-template-columns:minmax(0,1fr)}
.col{min-height:0;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.grow{flex:1 1 auto;min-height:0}
.ctl{display:flex;flex-direction:column;gap:1px;min-width:0}
.ctl label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ctl label b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
input[type=range]{width:100%;accent-color:var(--accent);direction:ltr;margin:2px 0;height:16px}
.check{display:flex;gap:6px;align-items:center;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:4px}
.tb{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 7px;font-size:11.5px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.tb[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel2))}
.tb .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.tb:focus-visible,.btn:focus-visible,.tchip:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
.btn.primary{background:var(--accent);color:#071110;border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 8px;cursor:pointer;font-size:11.5px}
#viewSeg{flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
/* stage */
.stage{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1 1 auto}
.hud{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;align-items:stretch}
@media (max-width:1400px){.hud{grid-template-columns:repeat(5,minmax(0,1fr))}}
.hc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;display:flex;flex-direction:column;min-width:0}
.hc span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc b{font-family:var(--f-mono);font-size:14px;font-weight:500;direction:ltr;text-align:start;white-space:nowrap}
.plate{position:relative;flex:1 1 auto;min-height:260px;display:flex;align-items:center;justify-content:center}
.plate.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start;height:0;border:1px solid var(--line);border-radius:8px}
.plate.zoom .pwrap{margin:auto}
.pwrap{position:relative;flex:none;line-height:0}
#flowCv{position:absolute;left:0;top:0;pointer-events:none}
#cellCv{height:170px!important}
#cmpA table td,#cmpA table th{padding:3px 6px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel2))}
#modCv{touch-action:none;cursor:crosshair;display:block}
.tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);color:var(--ink);font-family:var(--f-mono);font-size:11px;padding:5px 7px;border-radius:6px;white-space:pre;z-index:5;direction:ltr}
.legend{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);direction:ltr;justify-content:center}
.legend .bar2{height:7px;width:150px;border-radius:4px}
/* bench */
.bench{background:#000;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}
.meter canvas{width:100%;aspect-ratio:1.15;display:block}
.scope{grid-column:1/-1}
.scope canvas{width:100%;height:92px;display:block;border-radius:6px}
.lg{display:flex;gap:10px;font-family:var(--f-mono);font-size:10.5px;direction:ltr;flex-wrap:wrap;color:var(--muted)}
.scopectl{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.scopectl::before{display:none}
.sbtn{border:1px solid #2a3644;background:#0d141c;color:#cfd8e3;border-radius:5px;font-family:var(--f-mono);font-size:11px;line-height:1;padding:3px 7px;cursor:pointer}
.sbtn:hover{border-color:#5EA8FF}
.sbtn.paused{background:#5EA8FF;color:#040B0A;border-color:#5EA8FF}
.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lg span:not(.scopectl)::before{content:"";display:inline-block;width:9px;height:2px;margin-inline-end:4px;vertical-align:middle;background:var(--c)}
.benchlabel{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#6c7e91;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-mono);direction:ltr}
.chartbox{position:relative;direction:ltr;min-height:0}
.chartbox canvas{width:100%;height:230px;display:block}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.m{background:var(--panel2);border-radius:7px;padding:4px 7px;display:flex;flex-direction:column;min-width:0}
.m span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m b{font-family:var(--f-mono);font-size:13.5px;font-weight:500;direction:ltr;text-align:start;white-space:nowrap}
.m b small{font-size:10px;color:var(--muted);font-weight:400}
.bad b{color:var(--hot)!important} .warn b{color:var(--warn)!important} .good b{color:var(--ok)!important}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.chip.on{background:color-mix(in srgb,var(--diode) 22%,var(--panel));border-color:var(--diode)}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.insights li.ih{list-style:none;margin-inline-start:-16px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.insights li.chg{color:#ffd9a8}
.insights{margin:0;padding-inline-start:16px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.strings{display:flex;flex-direction:column;gap:6px}
.str{border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;gap:4px}
.tiles{display:flex;flex-wrap:wrap;gap:3px;direction:ltr}
.tile{width:17px;height:27px;border-radius:2px;border:2px solid transparent;cursor:pointer;padding:0;background:var(--tc,#335);position:relative}
.tile.sel{outline:2px solid var(--ink);outline-offset:1px}
.tile.sh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.6) 45%)}
.tile.byp{border-color:var(--diode)} .tile.hot{border-color:var(--hot)} .tile.rev{border-color:var(--hot);border-style:dashed}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{border:0;background:var(--panel2);width:24px;height:22px;cursor:pointer}
.step span{min-width:26px;text-align:center;font-family:var(--f-mono)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px}
td.num,th.num{text-align:end;direction:ltr}
.tw{overflow-x:auto}
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px 8px}
input[type=number]{direction:ltr;text-align:start}
input[type=number],input[type=text],select{width:100%;font:inherit;font-family:var(--f-mono);font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--ink)}
.verdict{font-size:12px;display:flex;flex-direction:column;gap:3px}
.pass{color:var(--ok)} .fail{color:var(--hot)} .caution{color:var(--warn)}
.note{font-size:11.5px;color:var(--muted);margin:0}
.hs{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55}
.hs li>b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600}
.hs li span b{color:#ffd08a;font-weight:600}
.hs li span{color:#c3cfdb}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.dcard{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2)}
.dcard.on{border-color:color-mix(in srgb,var(--diode) 60%,var(--line))}
@media (max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.cwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:12px;align-items:start}
#cSvg{background:#050C0B;border:1px solid var(--line);border-radius:10px;padding:8px;position:sticky;top:0}
.cside{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cside .insights{margin:0}
.ctag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;border:1px solid var(--line)}
.ctag.good{color:var(--amp);border-color:color-mix(in srgb,var(--amp) 55%,var(--line));background:color-mix(in srgb,var(--amp) 10%,transparent)}
.ctag.bad{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 60%,var(--line));background:color-mix(in srgb,var(--hot) 12%,transparent)}
.ctag.warn{color:var(--diode);border-color:color-mix(in srgb,var(--diode) 60%,var(--line));background:color-mix(in srgb,var(--diode) 12%,transparent)}
.ctag.info{color:var(--volt);border-color:color-mix(in srgb,var(--volt) 55%,var(--line));background:color-mix(in srgb,var(--volt) 10%,transparent)}
.ctag.off{color:var(--muted)}
@media (max-width:980px){.cwrap{grid-template-columns:minmax(0,1fr)} #cSvg{position:static}}
.circ-hero{position:relative;font-weight:600;color:#071110;border:0;padding:5px 12px;background:linear-gradient(135deg,#F0B429,#ffd36b 45%,#3DDC97);box-shadow:0 0 0 1px #F0B42999,0 0 14px #F0B42966;animation:circGlow 2.4s ease-in-out infinite;display:inline-flex;align-items:center;gap:6px}
.circ-hero .ico{font-size:13px}
.circ-hero:hover{filter:brightness(1.08);box-shadow:0 0 0 1px #F0B429,0 0 22px #F0B429aa}
@keyframes circGlow{0%,100%{box-shadow:0 0 0 1px #F0B42999,0 0 10px #F0B42955}50%{box-shadow:0 0 0 1px #F0B429,0 0 22px #F0B429aa}}
@media (prefers-reduced-motion:reduce){.circ-hero{animation:none}}
.hs li::marker{color:var(--pwr);font-family:var(--f-mono)}
.tb.hot{border-color:color-mix(in srgb,var(--hot) 60%,var(--line));color:#ffb3aa}
.locbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2)}
.btn.reset{border-color:color-mix(in srgb,var(--hot) 55%,var(--line));color:#ffb3aa}
.toolhelp{font-size:11px;color:var(--muted)}
#tiltCv{height:120px!important}
.tiltgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.tiltgrid .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.tiltgrid{grid-template-columns:minmax(0,1fr)}}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px}
.lgd span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle;background:var(--c)}
.cmpgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmpgrid .chartbox canvas{height:250px}
/* dialog */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--c-custom);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px}
.fgrid .ctl.found input{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.fgrid .ctl.miss input{border-color:color-mix(in srgb,var(--warn) 70%,var(--line))}
[hidden]{display:none!important}
@media (max-width:1180px){
  body{overflow:auto} .app{height:auto} .main{grid-template-columns:250px minmax(0,1fr)} .col.right{grid-column:1/-1} .col{overflow:visible}
  .plate{min-height:520px}
}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)} .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .cmpgrid{grid-template-columns:minmax(0,1fr)}
  .chipsTech{margin-inline-start:0} .metrics{grid-template-columns:repeat(3,minmax(0,1fr))} .plate{min-height:460px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

<script>
// ---------- PV cell-level engine ----------
const KB = 8.617333e-5;
const TECHS = {
  topcon: { id:'topcon', brand:'JinkoSolar', model:'Tiger Neo JKM580N-72HL4-V', tech:'N-type TOPCon',
    Pmax:580, Vmp:42.37, Imp:13.69, Voc:51.02, Isc:14.47, aIsc:0.045, bVoc:-0.25, gP:-0.29, noct:45, eff:22.45,
    w:1134, h:2278, kind:'csi', cols:6, rows:24, Np:2, Ns:72, nSub:3, bypass:true, vbr:-16, rshMult:300,
    bif:0, tol:3, vsys:1500, cellDesc:'144 half-cells (6×24)', nRange:[0.9,2.0] },
  hjt: { id:'hjt', brand:'Huasun', model:'Himalaya G12 HS-210-B132DS700', tech:'Heterojunction (HJT)',
    Pmax:700, Vmp:42.10, Imp:16.63, Voc:50.13, Isc:17.43, aIsc:0.04, bVoc:-0.24, gP:-0.26, noct:44, eff:22.53,
    w:1303, h:2384, kind:'csi', cols:6, rows:22, Np:2, Ns:66, nSub:3, bypass:true, vbr:-12, rshMult:400,
    bif:0.90, tol:3, vsys:1500, cellDesc:'132 half-cells (6×22)', nRange:[0.9,2.0] },
  cdte: { id:'cdte', brand:'First Solar', model:'Series 6 FS-6450A', tech:'Thin film CdTe',
    Pmax:450, Vmp:186.8, Imp:2.41, Voc:221.1, Isc:2.57, aIsc:0.04, bVoc:-0.28, gP:-0.32, noct:45, eff:18.2,
    w:1232, h:2009, kind:'strip', cols:44, rows:24, strips:264, Np:1, Ns:264, nSub:1, bypass:false, vbr:-6, rshMult:150,
    bif:0, tol:5, vsys:1500, cellDesc:'~264 monolithic strip cells, no bypass diodes', nRange:[1.0,2.6] }
};
const AB = 0.002, MB = 3.7; // Bishop reverse-bias parameters

function vt(T){ return KB*(T+273.15); }

function fitTech(t){
  const Isc=t.Isc/t.Np, Voc=t.Voc/t.Ns, Vmp=t.Vmp/t.Ns, Imp=t.Imp/t.Np;
  const Rsh0=t.rshMult*Voc/Isc;
  const P=(n,Rs)=>{ const a=n*vt(25), Iph=Isc*(1+Rs/Rsh0); return {a,Iph,I0:(Iph-Voc/Rsh0)/(Math.exp(Voc/a)-1),Rs,Rsh:Rsh0}; };
  const I=(V,p)=>{ let i=p.Iph; for(let k=0;k<60;k++){ const vd=V+i*p.Rs, e=p.I0*Math.exp(vd/p.a);
      const f=p.Iph-(e-p.I0)-vd/p.Rsh-i, df=-e*p.Rs/p.a-p.Rs/p.Rsh-1; i-=f/df; } return i; };
  const fitRs=n=>{ let lo=0,hi=Voc/Isc*0.6; if(I(Vmp,P(n,0))<Imp) return null;
      for(let k=0;k<70;k++){ const m=(lo+hi)/2; if(I(Vmp,P(n,m))>Imp) lo=m; else hi=m; } return (lo+hi)/2; };
  let best=null;
  for(let n=t.nRange[0];n<=t.nRange[1];n+=0.005){
    const Rs=fitRs(n); if(Rs===null) continue; const p=P(n,Rs), h=1e-4;
    const d=((Vmp+h)*I(Vmp+h,p)-(Vmp-h)*I(Vmp-h,p))/(2*h);
    if(!best||Math.abs(d)<best.d) best={d:Math.abs(d),n,Rs};
  }
  if(!best) throw new Error('fit');
  t.fit={ n:best.n, Rs:best.Rs, Rsh:Rsh0, Isc, Voc, Vmp, Imp, kn:0 };
  // tune ideality temperature slope so model Pmax temperature coefficient matches datasheet
  const pmp=T=>{ const p=cellParams(t,1000,T,1,0); let b=0; for(let k=0;k<=400;k++){ const i=p.Iph*k/400, v=cellV(i,p); if(v*i>b) b=v*i; } return b; };
  const p25=pmp(25); let lo=-0.01, hi=0.01;
  for(let k=0;k<30;k++){ t.fit.kn=(lo+hi)/2; const g=(pmp(65)/p25-1)/40*100; if(g<t.gP) hi=t.fit.kn; else lo=t.fit.kn; }
  t.fit.kn=(lo+hi)/2;
  return t.fit;
}

function cellParams(t,G,T,iphScale,defect){
  const f=t.fit, dT=T-25, a=f.n*(1+(f.kn||0)*dT)*vt(T);
  const IscT=f.Isc*(1+t.aIsc/100*dT), VocT=f.Voc*(1+t.bVoc/100*dT);
  let Rs=f.Rs, Rsh=f.Rsh*Math.min(10,1000/Math.max(G,1));
  const Iph1000=IscT*(1+f.Rs/f.Rsh);
  const I0=(Iph1000-VocT/f.Rsh)/(Math.exp(VocT/a)-1);
  let Iph=Iph1000*Math.max(G,0)/1000*iphScale;
  if(defect===1) Iph*=0.6;            // crack: ~40% inactive area
  if(defect===2) Rsh=Math.min(Rsh,f.Rsh)*0.01; // shunted cell
  if(defect===3) Rs*=8;               // broken ribbon / high series R
  return {a,Iph,I0,Rs,Rsh,vbr:t.vbr};
}

function cellV(I,p){
  let lo=p.vbr*0.99995, hi=p.a*Math.log((Math.abs(p.Iph)+Math.abs(I)+2)/p.I0+1);
  for(let k=0;k<50;k++){
    const vd=(lo+hi)/2;
    const ish = vd<0 ? vd/p.Rsh*(1+AB*Math.pow(1-vd/p.vbr,-MB)) : vd/p.Rsh;
    const f=p.Iph-p.I0*(Math.exp(vd/p.a)-1)-ish-I;
    if(f>0) lo=vd; else hi=vd;
  }
  return (lo+hi)/2-I*p.Rs;
}

// monotone helpers. x ascending.
function interp(x,y,q){ const n=x.length; if(q<=x[0]) return y[0]+(y[1]-y[0])*(q-x[0])/(x[1]-x[0]);
  if(q>=x[n-1]) return y[n-1]+(y[n-1]-y[n-2])*(q-x[n-1])/(x[n-1]-x[n-2]);
  let lo=0,hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(x[m]<=q) lo=m; else hi=m; }
  return y[lo]+(y[hi]-y[lo])*(q-x[lo])/(x[hi]-x[lo]); }
// y decreasing over ascending x; return x where y=q (clamped)
function invDec(x,y,q){ const n=x.length; if(q>=y[0]) return x[0]; if(q<=y[n-1]) return x[n-1];
  let lo=0,hi=n-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(y[m]>=q) lo=m; else hi=m; }
  const d=y[lo]-y[hi]; return d<=0?x[lo]:x[lo]+(x[hi]-x[lo])*(y[lo]-q)/d; }
function vByp(I){ return -0.03*Math.log(Math.max(I,0)/1e-6+1); }

function hash32(a,b){ let h=(a*374761393+b*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }

class Engine{
  constructor(t,env){ this.t=t; if(!t.fit) fitTech(t); this.setEnv(env); }
  setEnv(env){
    this.env=Object.assign({G:1000,Tamb:25,Grear:0,cellMis:0,tolMis:false,Tfix:null},env);
    const t=this.t, N=420, gmax=Math.max(this.env.G+t.bif*this.env.Grear,150)*1.08;
    const Imin=-0.25*t.Isc, Imax=t.Isc*gmax/1000*1.3*(1+t.aIsc/100*70);
    this.Ig=new Float64Array(N); for(let i=0;i<N;i++) this.Ig[i]=Imin+(Imax-Imin)*i/(N-1);
    this.Cg=this.Ig.map(v=>v/t.Np);
    this.cellCache=new Map(); this.modCache=new Map();
  }
  nPaint(){ return this.t.cols*this.t.rows; }
  newModule(){ return { shade:new Float32Array(this.nPaint()), defect:new Uint8Array(this.nPaint()), soil:0, gf:1, dT:0, degr:0 }; }
  // per-physical-cell conditions
  cellList(m,idx){
    const t=this.t, e=this.env, out=[]; const tolF = e.tolMis ? 1+t.tol/100*hash32(idx,7) : 1;
    const base=(1-m.soil/100)*m.gf, degrF=(1-m.degr/100)*tolF;
    const temp=G=>e.Tfix!=null? e.Tfix+m.dT : e.Tamb+(t.noct-20)/800*G+m.dT;
    const mk=(sh,def,ci)=>{ const G=e.G*base*(1-sh)+t.bif*e.Grear; const T=temp(G);
      let s=degrF; if(e.cellMis>0) s*=1+(hash32(idx*977+ci,13)-0.5)*2*e.cellMis/100;
      s=Math.round(s*200)/200; const Gq=Math.round(G), Tq=Math.round(T*2)/2;
      return {G:Gq,T:Tq,d:def,s,key:Gq+'|'+Tq+'|'+def+'|'+s}; };
    if(t.kind==='csi'){ for(let i=0;i<t.cols*t.rows;i++) out.push(mk(m.shade[i],m.defect[i],i)); }
    else { const per=t.strips/t.cols;
      for(let c=0;c<t.cols;c++){ let sh=0,d=0; for(let r=0;r<t.rows;r++){ sh+=m.shade[r*t.cols+c]; d=Math.max(d,m.defect[r*t.cols+c]); }
        sh/=t.rows; for(let k=0;k<per;k++) out.push(mk(sh,d,c*per+k)); } }
    return out;
  }
  cellCurve(c){ let v=this.cellCache.get(c.key); if(v) return v;
    const p=cellParams(this.t,c.G,c.T,c.s,c.d); v=new Float64Array(this.Cg.length);
    for(let i=0;i<v.length;i++) v[i]=cellV(this.Cg[i],p); this.cellCache.set(c.key,v); return v; }
  modKey(m,idx){ const a=[]; for(let i=0;i<m.shade.length;i++) if(m.shade[i]>0||m.defect[i]) a.push(i+':'+m.shade[i].toFixed(2)+':'+m.defect[i]);
    const e=this.env; return a.join(',')+'#'+m.soil+'|'+m.gf+'|'+m.dT+'|'+m.degr+((e.tolMis||e.cellMis>0)?'@'+idx:''); }
  module(m,idx=0){
    const key=this.modKey(m,idx); let r=this.modCache.get(key); if(r) return r;
    const t=this.t, Ig=this.Ig, Cg=this.Cg, N=Ig.length, cells=this.cellList(m,idx);
    r={cells,V:new Float64Array(N),subs:[]};
    if(t.kind==='csi'){
      const H=t.Np, half=t.rows/H, cps=t.cols/t.nSub;
      for(let s=0;s<t.nSub;s++){
        const halves=Array.from({length:H},(_,h)=>{ const V=new Float64Array(N), ids=[];
          for(let rr=h*half;rr<(h+1)*half;rr++) for(let cc=cps*s;cc<cps*(s+1);cc++){ const id=rr*t.cols+cc; ids.push(id);
            const cv=this.cellCurve(cells[id]); for(let i=0;i<N;i++) V[i]+=cv[i]; }
          return {V,ids}; });
        const raw=new Float64Array(N), Vs=new Float64Array(N);
        if(H===1){ for(let i=0;i<N;i++){ raw[i]=halves[0].V[i]; Vs[i]=t.bypass?Math.max(raw[i],vByp(Ig[i])):raw[i]; r.V[i]+=Vs[i]; } }
        else {
        const vmax=Math.max(...halves.map(h=>h.V[0])), vmin=-1.5, NV=500;
        const Vg=new Float64Array(NV), Is=new Float64Array(NV);
        for(let j=0;j<NV;j++){ const v=vmin+(vmax-vmin)*j/(NV-1); Vg[j]=v; let a=0; halves.forEach(h=>a+=invDec(Cg,h.V,v)); Is[j]=a; }
        const negIs=Is.map(x=>-x);
        for(let i=0;i<N;i++){ const I=Ig[i]; let v;
          if(I>Is[0]) v=vmin-(I-Is[0])*50; else if(I<Is[NV-1]) v=vmax; else v=interp(negIs,Vg,-I);
          raw[i]=v; Vs[i]=t.bypass?Math.max(v,vByp(I)):v; r.V[i]+=Vs[i]; } }
        r.subs.push({halves,raw,V:Vs});
      }
    } else {
      const V=new Float64Array(N);
      for(let id=0;id<cells.length;id++){ const cv=this.cellCurve(cells[id]); for(let i=0;i<N;i++) V[i]+=cv[i]; }
      for(let i=0;i<N;i++) r.V[i]=V[i];
      r.subs.push({halves:[{V,ids:cells.map((_,i)=>i)}],raw:V,V});
    }
    r.mpp=mppVI(Ig,r.V);
    this.modCache.set(key,r); return r;
  }
  // operating state of every cell at module current I
  trace(r,I){
    const t=this.t, Cg=this.Cg, Ig=this.Ig, cellOut=new Array(r.cells.length), subOut=[];
    const area=t.w*t.h/1e6/(t.Ns*t.Np);
    const Tm=r.cells.reduce((a,c)=>a+c.T,0)/r.cells.length;
    r.subs.forEach(s=>{
      const raw=interp(Ig,s.raw,I), vb=vByp(I), on=t.bypass&&raw<vb, Vs=on?vb:raw;
      subOut.push({V:Vs,bypass:on,Id:on?Math.max(0,I-s.halves.reduce((a,h)=>a+invDec(Cg,h.V,Vs)*(t.Np===1?1:1),0)):0});
      s.halves.forEach(h=>{ const Ih = t.kind!=='csi' ? I : invDec(Cg,h.V,Vs);
        h.ids.forEach(id=>{ const c=r.cells[id], V=interp(Cg,this.cellCurve(c),Ih), Pd=Math.max(0,-V*Ih);
          cellOut[id]={V,I:Ih,Pd,G:c.G,T:c.T,Th:0.4*c.T+0.6*Tm+Pd/(25*area*2),d:c.d}; }); });
    });
    return {cells:cellOut,subs:subOut};
  }
  stringV(mods,idxBase){ const N=this.Ig.length, V=new Float64Array(N), res=[];
    mods.forEach((m,k)=>{ const r=this.module(m,idxBase+k); res.push(r); for(let i=0;i<N;i++) V[i]+=r.V[i]; });
    return {V,res}; }
  array(strings){
    let idx=0; const S=strings.map(s=>{ const o=this.stringV(s,idx); idx+=s.length; return o; });
    const vmax=Math.max(...S.map(s=>s.V[0]),1), NV=900, Vg=new Float64Array(NV), I=new Float64Array(NV);
    for(let j=0;j<NV;j++){ const v=vmax*j/(NV-1); Vg[j]=v; let s=0; S.forEach(o=>s+=invDec(this.Ig,o.V,v)); I[j]=s; }
    const P=Vg.map((v,j)=>v*I[j]);
    return {S,Vg,I,P};
  }
}
function mppVI(Ig,V){ let b=-1,bi=0; for(let i=0;i<Ig.length;i++){ if(Ig[i]<0) continue; const p=Ig[i]*V[i]; if(p>b){b=p;bi=i;} }
  return {P:b,V:V[bi],I:Ig[bi],Voc:interpVoc(Ig,V),Isc:interpIsc(Ig,V)}; }
function interpVoc(Ig,V){ return interp(Ig,V,0); }
function interpIsc(Ig,V){ return invDec(Ig,V,0); }
function localMax(Vg,P){ const pm=Math.max(...P), out=[];
  for(let j=2;j<P.length-2;j++){ if(P[j]>P[j-1]&&P[j]>=P[j+1]&&P[j]>0.03*pm){ if(out.length&&Vg[j]-out[out.length-1].V<Vg[Vg.length-1]*0.01){ if(P[j]>out[out.length-1].P) out[out.length-1]={V:Vg[j],P:P[j],j}; } else out.push({V:Vg[j],P:P[j],j}); } }
  return out; }
if(typeof module!=='undefined') module.exports={TECHS,fitTech,Engine,localMax,interp,invDec,cellParams,cellV};

</script>

// ---------- hot-spot scenario + explainer ----------
function hotCellIndex(T){ return T.kind==='csi' ? Math.floor(T.rows*0.25)*T.cols+Math.min(T.cols-1,Math.floor(T.cols*0.45)) : Math.floor(T.cols*0.45); }
function applyCellShade(T,m,idx,f){ if(T.kind==='csi') m.shade[idx]=f; else { const c=idx%T.cols; for(let r=0;r<T.rows;r++) m.shade[r*T.cols+c]=f; } }
function worstHotSpot(){
  const T=CT(), Iforce=eng.module(eng.newModule()).mpp.I, idx=hotCellIndex(T); let best={f:1,Pd:-1,Th:0,V:0,I:0};
  for(let f=0.1;f<=1.0001;f+=0.05){ const m=eng.newModule(); applyCellShade(T,m,idx,Math.round(f*100)/100);
    const r=eng.module(m,0), tr=eng.trace(r,Iforce); const c=tr.cells.reduce((a,x)=>x.Pd>a.Pd?x:a);
    if(c.Pd>best.Pd) best={f:Math.round(f*100)/100,Pd:c.Pd,Th:c.Th,V:c.V,I:c.I}; }
  return {...best,idx,Iforce};
}
let HS=null;
function makeHotSpot(){
  const T=CT(); pushUndo(); const w=worstHotSpot(); const m=selMod(); m.shade.fill(0); m.defect.fill(0);
  applyCellShade(T,m,w.idx,w.f); HS=w; S.insp=w.idx;
  S.ctx='arr'; S.view='read'; S.zoom=T.kind==='csi'; renderStatic(); layoutModule(); schedule();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const p=$('plate'), r=GEO&&GEO.rects[w.idx]; if(S.zoom&&r){ p.scrollTop=Math.max(0,r.y-p.clientHeight/2); p.scrollLeft=Math.max(0,r.x-p.clientWidth/2); } openHsInfo(); }));
}
function openHsInfo(){
  const T=CT(), ar=S.lang==='ar', A=v=>fmt(v,2)+' A';
  const cells=R.mtr?R.mtr.cells:[]; let hi=0; cells.forEach((c,i)=>{ if(c.Pd>cells[hi].Pd) hi=i; });
  const h=cells[hi]||{V:0,I:0,Pd:0,Th:0}, Iop=R.Icur||0, live=h.Pd>1;
  const Iref=R.mref?R.mref.mpp.I:T.Imp, perCell=T.Np===2?Iref/2:Iref;
  const cps=T.kind==='csi'?T.cols/T.nSub:1, cellsPerSub=T.kind==='csi'?T.rows/T.Np*cps:T.Ns;
  const vOthers=(cellsPerSub-1)*0.55;
  const wf=HS?Math.round(HS.f*100):null;
  const n=(x)=>`<b class="mono">${x}</b>`;
  const steps=ar?[
    ['حاجة بتغطي جزء من خلية واحدة',`فضلات طيور، ورقة شجر، تراب متجمع، أو شرخ. الخلية دي بتولّد تيار أقل من جيرانها بنسبة التغطية تقريباً${wf!=null?`، وهنا التغطية ${n(wf+'%')}`:''}.`],
    ['اللوح مش لوحده',`اللوح متوصل في استرينج مع ألواح تانية سليمة، وهي اللي بتفرض تيار الاسترينج (حوالي ${n(A(Iop||Iref))}) على كل الخلايا اللي على التوالي، ومنها الخلية المغطاة.`],
    ['الخلية بتتعكس',`الخلية مش قادرة تولّد التيار ده، فباقي الخلايا اللي معاها في نفس الـ substring (حوالي ${n(cellsPerSub-1)} خلية × 0.55 V ≈ ${n(fmt(vOthers,0)+' V')}) بيزقوا التيار فيها بالعكس، فجهدها بيبقى سالب${live?`: هنا ${n(fmt(h.V,1)+' V')}`:''}.`],
    ['بدل ما تنتج، بتستهلك',`القدرة اللي بتتحول حرارة = |V| × I${live?` = ${n(fmt(Math.abs(h.V),1)+' V')} × ${n(A(h.I))} = ${n(fmt(h.Pd,1)+' W')}`:''}، ومتركزة في مساحة خلية واحدة، فحرارتها بتطلع${live?` لـ ${n(fmt(h.Th,0)+'°C')}`:' جامد'} وجيرانها حوالي ${n(fmt(R.mtr?R.mtr.cells.reduce((a,c)=>a+c.T,0)/R.mtr.cells.length:45,0)+'°C')}.`],
    ['الـ bypass diode بيحمي بس مش بيلغي المشكلة',`الدايود بيحدد الجهد العكسي على الخلية بمجموع جهد باقي خلايا الـ substring تقريباً، فبيمنع إن جهد الاسترينج كله يتحط عليها. بس الخلية لسه بتسخن.`],
    ['أسوأ حالة هي التغطية الجزئية، مش الكاملة',`الخلية المضلمة خالص بتعدّي تيار عكسي قليل جداً. أما المغطاة جزئياً فبتعدّي تيار كبير وهي عليها جهد عكسي عالي، فالحرارة أكبر بكتير${wf!=null?`. في اللوح ده أسوأ نسبة تغطية طلعت ${n(wf+'%')}`:''}. عشان كده اختبار الـ hot spot في IEC 61215 بيدوّر على أسوأ نسبة تظليل.`],
    ['ليه لما تظلل خلايا أكتر حرارتهم بتقل',`لو اتنين أو أكتر في نفس الـ substring متظللين، بيتقسم عليهم الجهد العكسي (مثلاً حوالي 7 V لكل واحدة بدل 15 V). عند الجهد ده الخلية بتعدّي تيار عكسي صغير، فكل واحدة بتبدد حرارة قليلة والـ bypass diode بيشيل التيار. وكمان الخلية المظللة مش بتسخن من الشمس.`],
    ['في الحقيقة بيحصل إيه',`اصفرار أو حرق في الـ EVA والـ backsheet، انفصال طبقات، شرخ في الزجاج، ولو الحالة شديدة ممكن حريق. بيتكشف بالتصوير الحراري (IR) بالدرون. والوقاية: التنظيف، تجنب الظل الجزئي في التصميم، ألواح Half-cut، bypass diodes أكتر، أو optimizers.`]]
  :[
    ['Something covers part of one cell',`A bird dropping, a leaf, caked dust or a crack. That cell now generates less current than its neighbours, roughly in proportion to the covered area${wf!=null?`; here ${n(wf+'%')} is covered`:''}.`],
    ['The module is not alone',`It sits in a string with healthy modules, and they set the string current (about ${n(A(Iop||Iref))}) through every cell in series, including the covered one.`],
    ['The cell is driven into reverse',`It cannot generate that current, so the other cells in its substring (about ${n(cellsPerSub-1)} cells × 0.55 V ≈ ${n(fmt(vOthers,0)+' V')}) push the current through it backwards and its voltage goes negative${live?`: here ${n(fmt(h.V,1)+' V')}`:''}.`],
    ['It absorbs power instead of producing it',`Heat = |V| × I${live?` = ${n(fmt(Math.abs(h.V),1)+' V')} × ${n(A(h.I))} = ${n(fmt(h.Pd,1)+' W')}`:''}, concentrated in a single cell, so it climbs${live?` to ${n(fmt(h.Th,0)+'°C')}`:' sharply'} while its neighbours sit around ${n(fmt(R.mtr?R.mtr.cells.reduce((a,c)=>a+c.T,0)/R.mtr.cells.length:45,0)+'°C')}.`],
    ['The bypass diode protects, but does not remove it',`The diode limits the reverse voltage on the cell to about the sum of the other cells in its substring, so the whole string voltage can never land on it. The cell still heats up.`],
    ['Partial covering is worse than full covering',`A fully dark cell lets very little reverse current through. A partly covered cell still passes a large current while sitting at a high reverse voltage, so it dissipates far more${wf!=null?`. For this module the worst coverage came out at ${n(wf+'%')}`:''}. That is why the IEC 61215 hot-spot test searches for the worst shading level.`],
    ['Why shading more cells makes them cooler',`When two or more cells in the same substring are covered, they share the reverse voltage (about 7 V each instead of 15 V). At that voltage a cell passes very little reverse current, so each dissipates little heat and the bypass diode carries the current. A shaded cell also gets no solar heating.`],
    ['What it looks like in the field',`Browning or burn marks in the EVA and backsheet, delamination, cracked glass, and in severe cases fire. It is found with drone IR thermography. Prevention: cleaning, avoiding partial shade in the layout, half-cut modules, more bypass diodes, or optimizers.`]];
  $('hsBody').innerHTML=steps.map((s,i)=>`<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('');
  $('hsModal').hidden=false;
}

// ================= equivalent circuit: cell / module / string =================
const CIR={lvl:'module',cell:null};
const CC={gen:'#3DDC97',rev:'#FF5D4F',open:'#6E8783',short:'#5EA8FF',diode:'#FF8A3D',wire:'#8AA39E',txt:'#E8F0EE',mut:'#8AA39E'};
const svgT=(x,y,s,o={})=>`<text x="${x}" y="${y}" fill="${o.c||CC.txt}" font-size="${o.fs||11}" text-anchor="${o.a||'middle'}" ${o.w?'font-weight="600"':''} ${o.rtl?'direction="rtl" style="font-family:\'IBM Plex Sans Arabic\',sans-serif"':''}>${s}</text>`;
const lw=(I,Imax)=>Math.max(1.2,Math.min(7,1.2+5.8*Math.abs(I)/Math.max(Imax,1e-3)));
function cellBreak(T,id){ const c=R.mr.cells[id], op=R.mtr.cells[id], p=cellParams(T,c.G,c.T,c.s,c.d), I=op.I, V=op.V, vd=V+I*p.Rs;
  const ID=p.I0*(Math.exp(vd/p.a)-1), Ish=vd/p.Rsh, Ibr=vd<0?vd/p.Rsh*AB*Math.pow(1-vd/p.vbr,-MB):0;
  return {c,op,p,I,V,vd,Iph:p.Iph,ID,Ish,Ibr,PRs:I*I*p.Rs,PD:vd*ID,Psh:vd*Ish,Pbr:vd*Ibr,Pgen:vd*p.Iph,Pout:V*I}; }
function cellCircuit(T,id){ const ar=S.lang==='ar', b=cellBreak(T,id), W=600,H=290, yT=46, yB=232, xs=[90,200,310,420], xR=[470,530], Imax=Math.max(b.Iph,Math.abs(b.I),0.5);
  const up=v=>v>=0?'↓':'↑'; // branch current sign: positive = top→bottom
  const pw=(P)=>(Math.abs(P)<0.05?'≈0 W':fmt(Math.abs(P),1)+' W');
  const brC=(P)=>Math.abs(P)>3?CC.rev:Math.abs(P)>0.5?CC.diode:CC.gen;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:720px;font-family:'IBM Plex Mono',monospace;direction:ltr">`;
  s+=`<line x1="50" y1="${yT}" x2="${xR[0]}" y2="${yT}" stroke="${CC.wire}" stroke-width="2"/><line x1="50" y1="${yB}" x2="${W-30}" y2="${yB}" stroke="${CC.wire}" stroke-width="2"/>`;
  // Iph source
  const x0=xs[0], cI=b.Pgen<0?CC.rev:CC.gen; s+=`<line x1="${x0}" y1="${yT}" x2="${x0}" y2="${yB}" stroke="${cI}" stroke-width="${lw(b.Iph,Imax)}"/><circle cx="${x0}" cy="139" r="22" fill="#0B1716" stroke="${cI}" stroke-width="2"/><line x1="${x0}" y1="152" x2="${x0}" y2="124" stroke="${cI}" stroke-width="2"/><polygon points="${x0-6},128 ${x0+6},128 ${x0},118" fill="${cI}"/>`;
  s+=svgT(x0,104,'Iph',{w:1})+svgT(x0+8,186,fmt(b.Iph,2)+' A ↑',{a:'start',c:cI,w:1})+svgT(x0+8,200,(b.Pgen>=0?(ar?'بيولّد ':'gen '):(ar?'بيمتص ':'absorbs '))+pw(b.Pgen),{a:'start',c:CC.mut,fs:10,rtl:ar});
  // diode
  const x1=xs[1], cD=brC(b.PD); s+=`<line x1="${x1}" y1="${yT}" x2="${x1}" y2="${yB}" stroke="${cD}" stroke-width="${lw(b.ID,Imax)}" opacity="${Math.abs(b.ID)<0.02?0.35:1}"/><polygon points="${x1-13},128 ${x1+13},128 ${x1},150" fill="#0B1716" stroke="${cD}" stroke-width="2"/><line x1="${x1-13}" y1="150" x2="${x1+13}" y2="150" stroke="${cD}" stroke-width="2.4"/>`;
  s+=svgT(x1,104,ar?'دايود الخلية':'D (junction)',{w:1,rtl:ar})+svgT(x1+8,186,fmt(Math.abs(b.ID),2)+' A '+up(b.ID),{a:'start',c:cD,w:1})+svgT(x1+8,200,pw(b.PD),{a:'start',c:CC.mut,fs:10});
  // Rsh
  const x2=xs[2], cS=brC(b.Psh); const zz=(x,y0)=>{ let d=`M${x},${y0}`; for(let i=0;i<6;i++) d+=` L${x+(i%2?-9:9)},${y0+5+i*8}`; return d+` L${x},${y0+52}`; };
  s+=`<line x1="${x2}" y1="${yT}" x2="${x2}" y2="113" stroke="${cS}" stroke-width="${lw(b.Ish,Imax)}"/><path d="${zz(x2,113)}" fill="none" stroke="${cS}" stroke-width="2"/><line x1="${x2}" y1="165" x2="${x2}" y2="${yB}" stroke="${cS}" stroke-width="${lw(b.Ish,Imax)}"/>`;
  s+=svgT(x2,104,'Rsh '+(b.p.Rsh>=10?fmt(b.p.Rsh,0):fmt(b.p.Rsh,2))+' Ω',{w:1})+svgT(x2+8,186,fmt(Math.abs(b.Ish),2)+' A '+up(b.Ish),{a:'start',c:cS,w:1})+svgT(x2+8,200,pw(b.Psh),{a:'start',c:CC.mut,fs:10});
  // breakdown
  const x3=xs[3], cB=brC(b.Pbr); s+=`<line x1="${x3}" y1="${yT}" x2="${x3}" y2="${yB}" stroke="${cB}" stroke-width="${lw(b.Ibr,Imax)}" opacity="${Math.abs(b.Ibr)<0.02?0.35:1}"/><polygon points="${x3-13},150 ${x3+13},150 ${x3},128" fill="#0B1716" stroke="${cB}" stroke-width="2"/><path d="M${x3-17},124 L${x3-13},128 L${x3+13},128 L${x3+17},132" fill="none" stroke="${cB}" stroke-width="2.4"/>`;
  s+=svgT(x3,104,ar?'انهيار عكسي':'Breakdown',{w:1,rtl:ar})+svgT(x3+8,186,fmt(Math.abs(b.Ibr),2)+' A '+up(b.Ibr),{a:'start',c:cB,w:1})+svgT(x3+8,200,pw(b.Pbr),{a:'start',c:CC.mut,fs:10})+svgT(x3+8,216,'Vbr '+T.vbr+' V',{a:'start',c:CC.mut,fs:9.5});
  // Rs + terminals
  const cR=brC(b.PRs); s+=`<rect x="${xR[0]}" y="${yT-8}" width="40" height="16" fill="#0B1716" stroke="${cR}" stroke-width="2"/>`+svgT(xR[0]+20,yT-14,'Rs',{w:1})+svgT(xR[0]+20,yT+24,pw(b.PRs),{c:CC.mut,fs:10});
  s+=`<line x1="${xR[0]+40}" y1="${yT}" x2="${W-30}" y2="${yT}" stroke="${CC.wire}" stroke-width="${lw(b.I,Imax)}"/><circle cx="${W-30}" cy="${yT}" r="5" fill="${CC.txt}"/><circle cx="${W-30}" cy="${yB}" r="5" fill="${CC.txt}"/>`;
  s+=svgT(W-30,yT-14,'+',{w:1,fs:14})+svgT(W-30,yB+20,'−',{w:1,fs:14});
  const rev=b.V<-0.05; s+=svgT((W-30+xR[1])/2-30,(yT+yB)/2-14,'V = '+fmt(b.V,2)+' V',{c:rev?CC.rev:'#5EA8FF',w:1,fs:12})+svgT((W-30+xR[1])/2-30,(yT+yB)/2+4,'I = '+fmt(b.I,2)+' A',{c:CC.gen,w:1,fs:12})
    +svgT((W-30+xR[1])/2-30,(yT+yB)/2+22,(b.Pout>=0?(ar?'بتطلّع ':'out ')+fmt(b.Pout,2):(ar?'بتستهلك ':'absorbs ')+fmt(-b.Pout,1))+' W',{c:b.Pout>=0?CC.gen:CC.rev,w:1,fs:12,rtl:ar});
  s+=svgT(50,yB+34,ar?'↓ / ↑ = اتجاه التيار في كل فرع · التخانة = قيمة التيار · الأحمر = بيحرق قدرة':'↓ / ↑ = branch current direction · thickness = current · red = burning power',{a:'start',c:CC.mut,fs:10,rtl:false})+'</svg>';
  // text
  const L=[], A=v=>fmt(Math.abs(v),2)+' A', n=x=>`<b>${x}</b>`;
  L.push(ar?`الخلية دي (${cellName(T,id)}) عبارة عن مصدر تيار Iph بيتناسب مع الضوء اللي واصلها (${fmt(b.c.G,0)} W/m² → ${n(A(b.Iph))})، وجنبه توازي دايود الوصلة نفسها، ومقاومة Rsh (تسريب)، وفرع الانهيار العكسي، وكلهم توالي مع Rs (مقاومة الأصابع والريبون). KCL عند العقدة: Iph = I_D + I_sh + I_br + I.`
    :`This cell (${cellName(T,id)}) is a current source Iph proportional to the light it receives (${fmt(b.c.G,0)} W/m² → ${n(A(b.Iph))}), in parallel with its own junction diode, a leakage resistance Rsh and a reverse-breakdown path, all in series with Rs (fingers and ribbons). KCL at the node: Iph = I_D + I_sh + I_br + I.`);
  if(rev) L.push(ar?`${n('الخلية شغالة بالعكس:')} الاسترينج أو باقي الخلايا بيفرضوا عليها ${n(A(b.I))}، وهي بتولّد ${n(A(b.Iph))} بس. الفرق (${A(b.I-b.Iph)}) لازم يعدّي في فروع التسريب والانهيار بالعكس (↑)، وجهد الوصلة ${n(fmt(b.vd,1)+' V')}. القدرة = جهد × تيار في كل فرع: Rsh بيحرق ${n(pw(b.Psh))}، والانهيار ${n(pw(b.Pbr))}، والـ ${A(b.Iph)} اللي الضوء بيولّدهم نفسهم بيتزقوا عبر الوصلة المعكوسة، وده ${n(pw(b.Pgen))} كمان. المجموع ${n(fmt(-b.Pout,1)+' W')} جوه خلية واحدة، فبتوصل ${n(fmt(b.op.Th,0)+'°C')}.${b.Pbr>b.Psh?' معظم التيار الزيادة عدّى في فرع الانهيار لأن الجهد قريب من Vbr، وده اللي بيعمل الـ hot spot الحاد.':''}`
    :`${n('The cell runs in reverse:')} the string or the other cells force ${n(A(b.I))} through it, but it generates only ${n(A(b.Iph))}. The difference (${A(b.I-b.Iph)}) must pass backwards (↑) through the leakage and breakdown paths, with the junction at ${n(fmt(b.vd,1)+' V')}. Power = voltage × current in each branch: Rsh burns ${n(pw(b.Psh))}, breakdown ${n(pw(b.Pbr))}, and the ${A(b.Iph)} photocurrent itself is pushed across the reversed junction, another ${n(pw(b.Pgen))}. In total ${n(fmt(-b.Pout,1)+' W')} inside one cell, so it reaches ${n(fmt(b.op.Th,0)+'°C')}.${b.Pbr>b.Psh?' Most of the extra current goes through the breakdown path because the voltage is close to Vbr; that is what makes a sharp hot spot.':''}`);
  else if(Math.abs(b.I)<0.15*Math.max(b.Iph,0.1)) L.push(ar?`${n('الخلية open circuit تقريباً:')} مفيش تيار طالع (${A(b.I)}) لأن خلية تانية في نفس السلسلة قافلة الطريق. كل الـ Iph (${A(b.Iph)}) بيلف جوه دايود الخلية نفسها (recombination) عند ${fmt(b.V,2)} V، فالـ ${pw(b.PD)} دي بتطلع حرارة بدل كهربا.`
    :`${n('The cell is almost open circuit:')} hardly any current leaves (${A(b.I)}) because another cell in the same chain blocks the path. All of Iph (${A(b.Iph)}) circulates through the cell's own junction (recombination) at ${fmt(b.V,2)} V, so that ${pw(b.PD)} becomes heat instead of electricity.`);
  else if(b.V<0.15&&b.I>0) L.push(ar?`${n('الخلية قريبة من الـ short circuit:')} بتعدّي ${A(b.I)} بس جهدها ${fmt(b.V,2)} V، يعني بتنتج تقريباً صفر. ده بيحصل للنص السليم لما الدايود الـ bypass يشتغل ويشد فولت القسم لحوالي −0.4 V.`
    :`${n('The cell is near short circuit:')} it carries ${A(b.I)} but sits at ${fmt(b.V,2)} V, so it produces almost nothing. That happens to the healthy half when the bypass diode conducts and pulls the substring to about −0.4 V.`);
  else L.push(ar?`${n('الخلية شغالة طبيعي:')} من الـ ${A(b.Iph)} اللي بتولّدهم، ${A(b.I)} طالعين برا، و ${A(b.ID)} بيرجعوا في دايود الوصلة (وده اللي بيحدد الـ Voc)، و ${A(b.Ish)} تسريب في Rsh. بتطلّع ${n(fmt(b.Pout,2)+' W')}، وبتخسر ${pw(b.PRs)} في Rs.`
    :`${n('The cell works normally:')} of the ${A(b.Iph)} it generates, ${A(b.I)} leaves, ${A(b.ID)} returns through the junction diode (this is what sets Voc) and ${A(b.Ish)} leaks through Rsh. It delivers ${n(fmt(b.Pout,2)+' W')} and loses ${pw(b.PRs)} in Rs.`);
  if(b.c.d===1) L.push(ar?'فيها شرخ: جزء من مساحتها معزول، فالـ Iph أقل بحوالي 40%.':'It is cracked: part of its area is isolated, so Iph is about 40% lower.');
  if(b.c.d===2) L.push(ar?`فيها shunt: الـ Rsh وقعت لـ ${fmt(b.p.Rsh,2)} Ω، فتيار كتير بيهرب جوه الخلية بدل ما يطلع، وجهدها وقع.`:`It is shunted: Rsh has dropped to ${fmt(b.p.Rsh,2)} Ω, so a lot of current leaks inside the cell instead of leaving, and its voltage collapses.`);
  if(b.c.d===3) L.push(ar?`فيها Rs عالية (ريبون مقطوع أو لحام بايظ): Rs اتضربت ×8، فبتحرق ${pw(b.PRs)} في Rs نفسها.`:`It has high Rs (broken ribbon or bad solder): Rs is ×8, so it burns ${pw(b.PRs)} in Rs itself.`);

      ?`اللوح ده جوه استرينج فيه ${ns} لوح${nSt>1?` (و ${nSt} استرينج متوازيين)`:''}. الإنفرتر بيختار فولت واحد يدّي أعلى قدرة للمصفوفة كلها (${n(fmt(R.op.P/1000,2)+' kW')} عند ${n(fmt(R.op.V,0)+' V')}، وضع ${S.track==='global'?'Global scan':'P&O'})، والفولت ده بيفرض على الاسترينج تيار ${n(A(I))} بيعدّي في كل لوح فيه، واللوح المظلل مالوش رأي. كل قسم في اللوح ده هو 1 من ${ns*T.nSub} قسم في الاسترينج، فالإنفرتر بيفضّل يسيب التيار عالي ويضحّي بفولت القسم المظلل.`
      :`This module sits in a string of ${ns} modules${nSt>1?` (and ${nSt} strings in parallel)`:''}. The inverter picks one voltage that gives the whole array the most power (${n(fmt(R.op.P/1000,2)+' kW')} at ${n(fmt(R.op.V,0)+' V')}, ${S.track==='global'?'global scan':'P&O'} mode). That voltage forces a string current of ${n(A(I))} through every module, and the shaded module has no say. Each substring here is 1 of ${ns*T.nSub} in the string, so the inverter prefers to keep the current high and sacrifice the shaded substring's voltage.`}</span></li>`; }
  // 2. rule
  html+=`<li><b>${ar?'قاعدة الدايود':'The diode rule'}</b><span>${ar
    ?'الدايود جزء passive محدش بيشغّله. بيبص على حاجة واحدة: هل الـ substring قادر يعدّي التيار المطلوب وفولته موجب؟ لو أيوه يفضل مطفي. لو لأ، الخلايا الضعيفة بتتعكس لحد ما فولت الـ substring يوصل حوالي −0.4 V، وساعتها الدايود يفتح ويعدّي الفرق.'
    :'The diode is passive; nothing switches it. It only depends on one thing: can the substring pass the required current at a positive voltage? If yes, it stays off. If not, the weak cells are driven into reverse until the substring reaches about −0.4 V, and the diode opens and carries the difference.'}</span></li>`;
  html+='</ol><div class="dgrid">';
  // 3. per substring
  mr.subs.forEach((s,k)=>{ const ts=tr.subs[k], Ih=s.halves.map(h=>T.Np===2?invDec(Cg,h.V,ts.V):I-(ts.bypass?ts.Id:0)), Ilim=Math.max(0,invDec(eng.Ig,s.raw,0));
    const col=Ih.map(v=>v<I/T.Np*0.6?'#ff6a5a':'#3DDC97');
    const ids=s.halves.flatMap(h=>h.ids); const shaded=ids.some(id=>R.mtr.cells[id].V<0);
    const why=ts.bypass?(ar?`الـ substring ده أقصى تيار يعدّيه وفولته موجب ${n(A(Ilim))}، والمطلوب ${n(A(I))}، فالدايود بيشيل الفرق ${n(A(ts.Id))}.`:`This substring can pass at most ${n(A(Ilim))} at a positive voltage, but ${n(A(I))} is needed, so the diode carries the difference, ${n(A(ts.Id))}.`)
      :shaded?(ar?`فيه ظل، بس لسه يقدر يعدّي ${n(A(Ilim))}، وده أكتر من المطلوب ${n(A(I))}، ففولته موجب والدايود مطفي.`:`It is shaded, but it can still pass ${n(A(Ilim))}, more than the ${n(A(I))} needed, so its voltage stays positive and the diode is off.`)
      :(ar?'سليم: بيعدّي التيار عادي وفولته موجب.':'Healthy: it carries the current at a positive voltage.');
    let kvl='';
    s.halves.forEach((h,hi)=>{ let w=h.ids[0]; h.ids.forEach(id=>{ if(R.mtr.cells[id].V<R.mtr.cells[w].V) w=id; }); const c=R.mtr.cells[w]; if(c.V>-0.2) return;
      const others=h.ids.filter(id=>id!==w), sumO=others.reduce((a,id)=>a+R.mtr.cells[id].V,0), nOth=others.length, nRev=h.ids.filter(id=>R.mtr.cells[id].V<-0.2).length;
      kvl+=`<p class="note" style="color:#c3cfdb;font-size:12.5px;margin:6px 0 0">${ar
        ?`<b>ليه الخلية (${cellName(T,w)}) عليها جهد سالب؟</b> الخلايا اللي في ${T.Np===2?(hi?'النص اللي تحت':'النص اللي فوق'):'القسم'} متوصلة توالي، ومجموع فولتاتهم لازم يساوي فولت الـ substring (${Vv(ts.V)})، لأنه متوصل بين نفس النقطتين مع ${T.Np===2?'النص التاني و':''}الدايود. باقي الخلايا (${nOth}) مجموعهم ${Vv(sumO)}، فالخلية دي لازم تبقى ${Vv(ts.V)} − ${Vv(sumO)} = ${n(Vv(c.V))}${nRev>1?`، والجهد العكسي متقسم على ${nRev} خلايا متظللة`:''}. التيار اللي ماشي فيها ${n(A(c.I))}، فبتبدد |V| × I = ${n(fmt(c.Pd,1)+' W')} حرارة (${fmt(c.Th,0)}°C).`
        :`<b>Why is cell (${cellName(T,w)}) negative?</b> The cells in ${T.Np===2?(hi?'the bottom half':'the top half'):'this substring'} are in series, and their voltages must add up to the substring voltage (${Vv(ts.V)}), because it sits between the same two nodes as ${T.Np===2?'the other half and ':''}the diode. The other ${nOth} cells add up to ${Vv(sumO)}, so this cell has to be ${Vv(ts.V)} − ${Vv(sumO)} = ${n(Vv(c.V))}${nRev>1?`, with the reverse voltage shared by ${nRev} shaded cells`:''}. ${n(A(c.I))} flows through it, so it dissipates |V| × I = ${n(fmt(c.Pd,1)+' W')} as heat (${fmt(c.Th,0)}°C).`}</p>`; });
    html+=`<div class="dcard ${ts.bypass?'on':''}">${subSvg(T,k,I,Ih,ts.Id,ts.bypass,ts.V,col)}<p class="note" style="color:#c3cfdb;font-size:12.5px;margin:4px 0 0">${why}</p>${kvl}</div>`; });
  html+='</div><ol class="hs" start="3">';
  if(T.Np===2) html+=`<li><b>${ar?'ليه النص السليم بيعدّي تيار ومش بينتج؟':'Why does the healthy half carry current but produce nothing?'}</b><span>${ar
    ?'النصين والدايود متوصلين بين نفس النقطتين، فكلهم على نفس الفولت. لما الدايود يشتغل الفولت ده بيبقى حوالي −0.4 V، فخلايا النص السليم بتشتغل قريب من الـ short circuit: تيار عالي (قرب الـ Isc بتاعه) بس فولت تقريباً صفر، يعني قدرة صفر. الفايدة الوحيدة إنه بيخفف الحمل على الدايود.'
    :'Both halves and the diode sit between the same two nodes, so they share one voltage. When the diode conducts that voltage is about −0.4 V, so the healthy half runs near short circuit: high current (close to its Isc) but almost zero voltage, so zero power. Its only benefit is taking load off the diode.'}</span></li>`;
  html+=`<li><b>${ar?'Global MPPT scan (المسح الكامل)':'Global MPPT scan'}</b><span>${ar
    ?'لما الظل يعمل أكتر من قمة في منحنى P-V، الـ MPPT العادي (Perturb & Observe) بيطلع على أقرب قمة ويقف، حتى لو مش الأعلى. خاصية الـ global/multi-peak scan بتخلّي الإنفرتر يمسح المنحنى كله كل فترة (مثلاً كل 15 دقيقة لساعة، ثواني قليلة كل مرة) ويقفز لأعلى قمة. في هواوي اسمها "MPPT multi-peak scanning" وبتتفعّل من الإعدادات مع فترة المسح. جرّبها في تبويب المصفوفة: Global ضد P&O.'
    :'When shade makes more than one peak on the P-V curve, a plain MPPT (perturb & observe) climbs the nearest peak and stays there, even if it is not the highest. A global (multi-peak) scan makes the inverter sweep the whole curve every so often (e.g. every 15–60 min, a few seconds each time) and jump to the highest peak. On Huawei it is "MPPT multi-peak scanning", enabled in the settings with a scan interval. Try it on the Array tab: Global vs P&O.'}</span></li>`;
  $('dBody').innerHTML='<ol class="hs">'+html+'</ol>'; $('dModal').hidden=false; }

// ================= current flow overlay =================
let FLOW=[], flowPhase=0, flowLast=0;
function buildFlow(T,tr,cells){
  FLOW=[]; if(!GEO) return; const g=GEO, Isc=R.mref?R.mref.mpp.Isc:T.Isc, col=v=>v<-0.05?'#ff6a5a':'#8ff5d2';
  const mk=(pts,I,Imax,diode)=>{ const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y)); FLOW.push({pts,cum,L:cum[cum.length-1],I,Imax,diode}); };
  if(T.kind==='csi'){ const cps=T.cols/T.nSub, hr=T.rows/T.Np;
    tr.subs.forEach((s,k)=>{ for(let hh=0;hh<T.Np;hh++){ const pts=[]; let first=-1;
        for(let j=0;j<cps;j++){ const cc=k*cps+j; const rows=[]; for(let r=hh*hr;r<(hh+1)*hr;r++) rows.push(r); if(j%2) rows.reverse();
          rows.forEach(r=>{ const id=r*T.cols+cc, q=g.rects[id]; if(first<0) first=id; pts.push({x:q.x+q.w/2,y:q.y+q.h/2,c:col(cells[id].V)}); }); }
        mk(pts,cells[first].I,Isc/T.Np,false); }
      if(s.bypass){ const x0=g.rects[cps*k].x, x1=g.rects[cps*(k+1)-1].x+g.cw, y=g.mid?GEO.H/2:GEO.H-g.fr*0.6-4; mk([{x:x0,y,c:'#ffb347'},{x:x1,y,c:'#ffb347'}],s.Id,Isc,true); } });
  } else { const r=Math.floor(T.rows/2), pts=[]; for(let cc=0;cc<T.cols;cc++){ const id=r*T.cols+cc, q=g.rects[id]; pts.push({x:q.x+q.w/2,y:q.y+q.h/2,c:col(cells[cellOf(T,id)].V)}); } mk(pts,R.Icur,Isc,false); }
}
function drawFlow(now){
  const cv=$('flowCv'); if(!cv) return; const dt=Math.min(0.1,(now-(flowLast||now))/1000); flowLast=now;
  const {c}=prep(cv); if(!S.flow||S.tab!=='module') return; flowPhase+=dt;
  FLOW.forEach(f=>{ if(f.L<1) return; const sp=80*Math.min(1.6,Math.abs(f.I)/Math.max(f.Imax,1e-6)); if(sp<1) return; const gap=f.diode?14:24, off=(flowPhase*sp)%gap;
    for(let d=off; d<f.L; d+=gap){ let i=1; while(i<f.cum.length&&f.cum[i]<d) i++; if(i>=f.pts.length) break;
      const a=f.pts[i-1], b=f.pts[i], seg=f.cum[i]-f.cum[i-1]||1, u=(d-f.cum[i-1])/seg, x=a.x+(b.x-a.x)*u, y=a.y+(b.y-a.y)*u;
      c.beginPath(); c.arc(x,y,f.diode?3:2.3,0,7); c.fillStyle=b.c; c.shadowColor=b.c; c.shadowBlur=6; c.fill(); } });
  c.shadowBlur=0;
}

// ================= IR camera view =================
const IRON=[[0,[4,2,18]],[0.15,[40,6,110]],[0.35,[140,10,140]],[0.55,[222,52,40]],[0.75,[255,145,10]],[0.9,[255,222,70]],[1,[255,255,235]]];
function iron(x){ x=Math.max(0,Math.min(1,x)); for(let i=1;i<IRON.length;i++) if(x<=IRON[i][0]){ const a=IRON[i-1],b=IRON[i],f=(x-a[0])/(b[0]-a[0]); return a[1].map((q,k)=>Math.round(q+(b[1][k]-q)*f)); } return IRON[IRON.length-1][1]; }
let IRR={lo:0,hi:1};
function drawIR(c,T,cells){
  const g=GEO; let lo=1e9,hi=-1e9; g.rects.forEach((r,i)=>{ const v=cells[cellOf(T,i)].Th; lo=Math.min(lo,v); hi=Math.max(hi,v); });
  if(hi-lo<8){ const m=(hi+lo)/2; lo=m-4; hi=m+4; } lo=lo-(hi-lo)*0.45; IRR={lo,hi};
  const off=document.createElement('canvas'); off.width=T.cols; off.height=T.rows; const oc=off.getContext('2d'), im=oc.createImageData(T.cols,T.rows);
  for(let i=0;i<T.cols*T.rows;i++){ const v=cells[cellOf(T,i)].Th, rgb=iron((v-lo)/(hi-lo)); im.data[i*4]=rgb[0]; im.data[i*4+1]=rgb[1]; im.data[i*4+2]=rgb[2]; im.data[i*4+3]=255; }
  oc.putImageData(im,0,0); c.save(); c.imageSmoothingEnabled=true; c.imageSmoothingQuality='high';
  const r0=g.rects[0], rl=g.rects[g.rects.length-1]; c.drawImage(off,r0.x,r0.y,rl.x+rl.w-r0.x,rl.y+rl.h-r0.y); c.restore();
  if(T.kind==='csi'){ c.strokeStyle='rgba(0,0,0,.22)'; c.lineWidth=1; g.rects.forEach(q=>c.strokeRect(q.x+0.5,q.y+0.5,q.w-1,q.h-1)); }
  let hiI=0; g.rects.forEach((r,i)=>{ if(cells[cellOf(T,i)].Th>cells[cellOf(T,hiI)].Th) hiI=i; });
  const r=g.rects[hiI], cx=r.x+r.w/2, cy=r.y+r.h/2; c.strokeStyle='#fff'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(cx-10,cy); c.lineTo(cx-3,cy); c.moveTo(cx+3,cy); c.lineTo(cx+10,cy); c.moveTo(cx,cy-10); c.lineTo(cx,cy-3); c.moveTo(cx,cy+3); c.lineTo(cx,cy+10); c.stroke();
  c.font='600 11px "IBM Plex Mono",monospace'; c.textAlign='left'; const txt='max '+fmt(hi,1)+'°C', tw=c.measureText(txt).width+8, tx=Math.min(GEO.W-tw-4,cx+12), ty=Math.max(4,cy-22);
  c.fillStyle='rgba(0,0,0,.7)'; c.fillRect(tx,ty,tw,16); c.fillStyle='#fff'; c.fillText(txt,tx+4,ty+12);
}

function drawGauge(cv,label,unit,val,fs,col){

  const f=Math.max(0,Math.min(1,val/fs)); c.strokeStyle=col; c.beginPath(); c.arc(cx,cy,r,a0,a0+(a1-a0)*f); c.stroke();

  const tl=v=>v===0?'0':fs>=1000?(+(v/1000).toFixed(1))+'k':+v.toFixed(2)+'';
  c.fillStyle='#6f8193'; c.font=`${Math.max(8,r*0.13)}px "IBM Plex Mono",monospace`; c.textAlign='center';
  for(let v=0;v<=fs+1e-9;v+=step){ const a=a0+(a1-a0)*v/fs; c.strokeStyle='#4d5d70'; c.lineWidth=1.2; c.beginPath();
    c.moveTo(cx+Math.cos(a)*(r-lw),cy+Math.sin(a)*(r-lw)); c.lineTo(cx+Math.cos(a)*(r-r*0.2),cy+Math.sin(a)*(r-r*0.2)); c.stroke();
    if(r>=36) c.fillText(tl(v),cx+Math.cos(a)*(r-r*0.36),cy+Math.sin(a)*(r-r*0.36)+3); }
  const an=a0+(a1-a0)*Math.max(-0.03,Math.min(1.03,val/fs));
  c.strokeStyle='#eef2f7'; c.lineWidth=2; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.cos(an)*r*0.82,cy+Math.sin(an)*r*0.82); c.stroke();
  c.fillStyle='#eef2f7'; c.beginPath(); c.arc(cx,cy,r*0.07,0,7); c.fill();
  c.fillStyle=col; c.font=`600 ${Math.max(12,r*0.27)}px "IBM Plex Mono",monospace`;
  c.fillText(Math.abs(val)>=1000?(val/1000).toFixed(2)+'k':val.toFixed(Math.abs(val)<10?2:1),cx,h-Math.max(15,r*0.38));
  c.fillStyle='#7b8ca0'; c.font=`${Math.max(9,r*0.15)}px "IBM Plex Mono",monospace`; c.fillText(label+' ['+unit+']',cx,h-3);
}

function stateLines(T,b){

      :`D${k+1} is OFF, and that is the worst case: substring ${k+1} needs ${A(b.I)} but can pass only ${A(s.Ilim)}, so its voltage sits at ${fmt(s.Vs,2)} V, right at the diode's turn-on edge. The diode carries almost nothing, and the covered cell takes nearly all the reverse stress on its own and heats up.`);
    else if(shaded) out.push(ar?`D${k+1} مطفي رغم الظل: الـ substring ${k+1} لسه يقدر يعدّي ${A(s.Ilim)} وده أكبر من التيار الحالي ${A(b.I)}، ففولته موجب ومفيش داعي للدايود يفتح.`
      :`D${k+1} is OFF despite the shade: substring ${k+1} can still pass ${A(s.Ilim)}, more than the present ${A(b.I)}, so its voltage stays positive and the diode has no reason to conduct.`); }); }

    if(rev.length>=2){ const v=rev.reduce((a,id)=>a+R.mtr.cells[id].V,0)/rev.length, pd=rev.reduce((a,id)=>a+R.mtr.cells[id].Pd,0);
      out.push(ar?`${rev.length} خلايا مظللة في الـ substring ${k+1} بيتقسم عليهم الجهد العكسي (حوالي ${fmt(v,1)} V لكل واحدة)، فكلهم مع بعض بيبددوا ${fmt(pd,1)} W بس، وبيفضلوا أبرد من خلية واحدة مظللة لوحدها.`
        :`${rev.length} shaded cells in substring ${k+1} share the reverse voltage (about ${fmt(v,1)} V each), so together they dissipate only ${fmt(pd,1)} W and stay cooler than a single shaded cell would.`); } }); }

  const h=b.hot; if(h.Pd>0.5) out.push(ar?`أسخن خلية (${cellName(T,h.i)}) حرارتها ${fmt(h.T,0)}°C: جهدها ${fmt(h.V,2)} V يعني عكسي، وبيعدّي فيها ${A(h.I)}، فبدل ما تنتج قدرة بتبدد ${fmt(h.Pd,1)} W حرارة (|V| × I).`
    :`Hottest cell (${cellName(T,h.i)}) is at ${fmt(h.T,0)}°C: it sits at ${fmt(h.V,2)} V (reverse) while ${A(h.I)} flows through it, so instead of producing power it dissipates ${fmt(h.Pd,1)} W as heat (|V| × I).`);

}
function explainChange(T,a,b){

  const dG=a.G!==b.G, dT=a.Ta!==b.Ta, dSh=a.sh!==b.sh, dCtx=a.ctx!==b.ctx;

  b.subs.forEach((s,k)=>{ const p=a.subs[k]; if(!p) return;
    if(!p.on&&s.on) out.push(ar?`D${k+1} اشتغل: الـ substring ${k+1} بقى أقصى تيار يعدّيه ${A(s.Ilim)} بس، والتيار المطلوب ${A(b.I)}. الخلايا المظللة اتعكس جهدها لحد ما فولت الـ substring وصل حوالي −0.4 V، فالدايود فتح وبقى يعدّي ${A(s.Id)} حواليهم.`
      :`D${k+1} turned ON: substring ${k+1} can now pass only ${A(s.Ilim)}, but the module current is ${A(b.I)}. Its shaded cells were driven into reverse until the substring reached about −0.4 V, so the diode opened and now carries ${A(s.Id)} around them.`);
    if(p.on&&!s.on){ const allLim=b.subs.every(q=>q.Ilim<b.Iref*0.9);
      if(b.I<a.I*0.97&&s.Ilim<=p.Ilim*1.02) out.push(ar?`D${k+1} طفي: نقطة التشغيل نزلت لتيار أقل (${A(a.I)} ← ${A(b.I)})${allLim?'، لأن كل الـ substrings بقت مظللة، ولو اتعمل لهم bypass كلهم الفولت هيبقى تقريباً صفر، فأحسن نقطة إن اللوح يمشي على تيار الخلايا المظللة':''}. عند التيار ده الـ substring ${k+1} يقدر يعدّيه بنفسه (حده ${A(s.Ilim)})، ففولته رجع موجب والدايود قفل.`
        :`D${k+1} turned OFF: the operating point moved to a lower current (${A(a.I)} → ${A(b.I)})${allLim?". Every substring is now shaded, and bypassing them all would leave almost no voltage, so the best point is to run at the shaded cells' current":''}. At this current substring ${k+1} can carry it by itself (limit ${A(s.Ilim)}), so its voltage is positive again and the diode closed.`);
      else out.push(ar?`D${k+1} طفي: الـ substring ${k+1} بقى يقدر يعدّي ${A(s.Ilim)} (كان ${A(p.Ilim)})، وده كفاية للتيار الحالي ${A(b.I)}، فمبقاش محتاج bypass.`
        :`D${k+1} turned OFF: substring ${k+1} can now pass ${A(s.Ilim)} (was ${A(p.Ilim)}), enough for the present ${A(b.I)}, so it no longer needs bypassing.`); } });
  if(rel(a.I,b.I)>0.03){ let why;
    if(dCtx) why=b.ctx==='arr'?(ar?'الاسترينج دلوقتي هو اللي بيفرض التيار على اللوح، مش أحسن نقطة للوح لوحده':"the string now forces its current through the module instead of the module's own best point"):(ar?'اللوح رجع يشتغل على أحسن نقطة ليه لوحده':"the module is back at its own best operating point");
    else if(dG) why=ar?`الإشعاع اتغير (${a.G} ← ${b.G} W/m²)، وتيار الخلية بيتناسب طردياً مع الإشعاع`:`irradiance changed (${a.G} → ${b.G} W/m²), and cell current is proportional to irradiance`;
    else if(dSh&&nOnB>nOnA&&b.I>a.I) why=ar?'الـ substring المظلل اتعمله bypass، فمبقاش بيحدد التيار واللوح رجع يشتغل قرب تياره الكامل':'the shaded substring is now bypassed, so it no longer limits the current and the module runs near full current again';
    else if(dSh&&b.I<a.I) why=ar?`الخلايا المظللة مش قادرة تعدّي أكتر من حوالي ${A(Math.min(...b.subs.map(s=>s.Ilim)))}، وعند أحسن نقطة اللوح بيمشي على تيارها بدل ما يعمل لها bypass`:`the shaded cells cannot pass more than about ${A(Math.min(...b.subs.map(s=>s.Ilim)))}, and at the best point the module follows their current rather than bypassing them`;
    else if(dSh) why=ar?'الظل أو العيوب اتغيرت، فحد التيار للخلايا الأضعف اتغير':'the shading or defects changed, which changed the current limit of the weakest cells';
    else if(dT) why=ar?`حرارة الخلايا اتغيرت، والتيار بيزيد شوية مع الحرارة (+${T.aIsc}%/°C)`:`cell temperature changed; current rises slightly with temperature (+${T.aIsc}%/°C)`;
    if(why) out.push(ar?`التيار ${A(a.I)} ← ${A(b.I)}: لأن ${why}.`:`Current ${A(a.I)} → ${A(b.I)} because ${why}.`); }
  if(rel(a.V,b.V)>0.03){ let why;
    if(nOnB!==nOnA) why=ar?`عدد الـ substrings اللي عليها bypass اتغير (${nOnA} ← ${nOnB})، وكل واحد بيشيل حوالي ${fmt(100/T.nSub,0)}% من فولت اللوح`:`the number of bypassed substrings changed (${nOnA} → ${nOnB}); each one removes about ${fmt(100/T.nSub,0)}% of the module voltage`;
    else if(dT||Math.abs(a.tmod-b.tmod)>2) why=ar?`حرارة الخلايا اتغيرت (${fmt(a.tmod,0)} ← ${fmt(b.tmod,0)}°C)، والفولت بيتغير ${T.bVoc}%/°C`:`cell temperature changed (${fmt(a.tmod,0)} → ${fmt(b.tmod,0)}°C), and voltage changes by ${T.bVoc}%/°C`;
    else if(rel(a.I,b.I)>0.03) why=ar?'نقطة التشغيل اتحركت على منحنى I-V: تيار أقل يعني فولت أعلى والعكس':'the operating point moved along the I-V curve: lower current means higher voltage and vice versa';
    if(why) out.push(ar?`الفولت ${fmt(a.V,1)} ← ${fmt(b.V,1)} V: لأن ${why}.`:`Voltage ${fmt(a.V,1)} → ${fmt(b.V,1)} V because ${why}.`); }
  if(Math.abs(a.hot.T-b.hot.T)>3){ const up=b.hot.T>a.hot.T, ci=up?b.hot.i:a.hot.i, ca=a.cells[ci], cb=b.cells[ci]; let why;
    if(ca&&cb&&Math.abs(ca.Pd-cb.Pd)>1){
      if(ca.V<-0.5&&cb.V>0&&dSh) why=ar?`الظل اتشال من عليها، فرجعت تولّد تيارها الكامل وبقت شغالة طبيعي بجهد موجب (${fmt(ca.V,1)} ← ${fmt(cb.V,2)} V) وبتنتج بدل ما تستهلك، فالحرارة اللي كانت بتبددها (${fmt(ca.Pd,1)} W) راحت`
        :`its shade was removed, so it generates its full current again and runs forward at a positive voltage (${fmt(ca.V,1)} → ${fmt(cb.V,2)} V), producing power instead of absorbing it, so the ${fmt(ca.Pd,1)} W it was dissipating is gone`;
      else if(nOnB>nOnA&&cb.Pd<ca.Pd) why=ar?`لما الدايود فتح، الجهد العكسي على الخلية المظللة اتحدد (${fmt(ca.V,1)} ← ${fmt(cb.V,1)} V)، فالحرارة اللي بتبددها نزلت من ${fmt(ca.Pd,1)} لـ ${fmt(cb.Pd,1)} W`
        :`once the diode opened, the reverse voltage on the shaded cell was capped (${fmt(ca.V,1)} → ${fmt(cb.V,1)} V), so the heat it dissipates fell from ${fmt(ca.Pd,1)} to ${fmt(cb.Pd,1)} W`;
      else if(nOnB<nOnA&&cb.Pd<ca.Pd&&b.I<a.I) why=ar?`تيار اللوح نزل لـ ${A(b.I)}، والخلايا السليمة جنبها بتقدر تشيله، فالتيار اللي كان بيتزق في الخلية المظللة بالعكس نزل (${A(ca.I)} ← ${A(cb.I)}) وجهدها العكسي قلّ (${fmt(ca.V,1)} ← ${fmt(cb.V,1)} V)، فبطّلت تبدد حرارة (${fmt(ca.Pd,1)} ← ${fmt(cb.Pd,1)} W)`
        :`the module current dropped to ${A(b.I)}, which the healthy cells next to it can carry, so the current forced through the shaded cell fell (${A(ca.I)} → ${A(cb.I)}) and its reverse voltage fell (${fmt(ca.V,1)} → ${fmt(cb.V,1)} V), so it stopped dissipating heat (${fmt(ca.Pd,1)} → ${fmt(cb.Pd,1)} W)`;
      else if(nOnB<nOnA&&cb.Pd>ca.Pd) why=ar?`لما الدايود قفل، الخلية المظللة بقت هي اللي شايلة التيار بجهد عكسي ${fmt(cb.V,1)} V، فبقت تبدد ${fmt(cb.Pd,1)} W`
        :`once the diode closed, the shaded cell had to carry the current at ${fmt(cb.V,1)} V reverse, so it now dissipates ${fmt(cb.Pd,1)} W`;
      else if(cb.Pd<ca.Pd&&cb.V<-0.5&&b.subs.some(q=>q.revN>=2)) why=ar?`بقت بتتقاسم الجهد العكسي مع خلية مظللة تانية في نفس الـ substring (${fmt(ca.V,1)} ← ${fmt(cb.V,1)} V)، وعند الجهد ده يكاد مفيش تيار عكسي يعدّي (${A(ca.I)} ← ${A(cb.I)})، فالحرارة اللي بتبددها نزلت من ${fmt(ca.Pd,1)} لـ ${fmt(cb.Pd,1)} W والدايود بقى شايل التيار`
        :`it now shares the reverse voltage with another shaded cell in the same substring (${fmt(ca.V,1)} → ${fmt(cb.V,1)} V), and at that voltage almost no reverse current flows (${A(ca.I)} → ${A(cb.I)}), so its dissipation fell from ${fmt(ca.Pd,1)} to ${fmt(cb.Pd,1)} W and the diode now carries the current`;
      else why=ar?`القدرة المبددة فيها اتغيرت (${fmt(ca.Pd,1)} ← ${fmt(cb.Pd,1)} W = |V| × I = ${fmt(Math.abs(cb.V),1)} V × ${A(cb.I)})`
        :`the power it dissipates changed (${fmt(ca.Pd,1)} → ${fmt(cb.Pd,1)} W = |V| × I = ${fmt(Math.abs(cb.V),1)} V × ${A(cb.I)})`; }
    else if(dT) why=ar?`حرارة الجو اتغيرت (${a.Ta} ← ${b.Ta}°C)`:`ambient temperature changed (${a.Ta} → ${b.Ta}°C)`;
    else if(dG) why=ar?'الإشعاع اتغير، فتسخين الشمس للخلايا اتغير':'irradiance changed, so solar heating of the cells changed';
    const t0=ca?ca.T:a.hot.T, t1=cb?cb.T:b.hot.T;
    if(why) out.push(ar?`الخلية (${cellName(T,ci)}) ${t1>t0?'سخنت':'بردت'} (${fmt(t0,0)} ← ${fmt(t1,0)}°C): لأن ${why}.`:`Cell (${cellName(T,ci)}) ${t1>t0?'heated up':'cooled down'} (${fmt(t0,0)} → ${fmt(t1,0)}°C) because ${why}.`); }
  if(!out.length&&dCtx) out.push(ar?(b.ctx==='arr'?`حطينا اللوح جوه المصفوفة: الاسترينج بيفرض تيار ${A(b.I)} (كان ${A(a.I)} على أحسن نقطة للوح لوحده)، والفرق صغير فالقراءات متغيرتش كتير.`:`رجعنا للوح لوحده على أحسن نقطة ليه: ${A(b.I)} (كان ${A(a.I)} جوه الاسترينج)، والفرق صغير.`)
    :(b.ctx==='arr'?`Placed inside the array: the string sets the current to ${A(b.I)} (was ${A(a.I)} at the module's own best point). The difference is small, so the readings barely moved.`:`Back to the module alone at its own best point: ${A(b.I)} (was ${A(a.I)} inside the string). The difference is small.`));
  if(out.length&&rel(a.P,b.P)>0.01) out.push(ar?`القدرة ${fmt(a.P,0)} ← ${fmt(b.P,0)} W.`:`Power ${fmt(a.P,0)} → ${fmt(b.P,0)} W.`);
  return out;
}

function moduleInsights(T,mr,ref,hotT,pd,loss,tL){
  const ar=S.lang==='ar', out=[], subsOn=R.mtr.subs.filter(s=>s.bypass).length, m=selMod();
  const anyShade=m.shade.some(x=>x>0), anyDef=m.defect.some(x=>x>0);
  let hot=null; R.mtr.cells.forEach(c=>{ if(!hot||c.Th>hot.Th) hot=c; });
  if(!anyShade&&!anyDef&&m.soil===0&&m.gf===1) out.push(ar?'اللوح نضيف. ظلّل خلايا أو اختار ظل جاهز، وراقب العدادات وجراف الـ substrings.':'The module is clean. Shade some cells or pick a preset, and watch the meters and the substring monitor.');
  if(T.kind==='strip'&&anyShade) out.push(ar?'الثن فيلم: شرايح بطول اللوح كلها توالي. الظل اللي بيقطع الشرايح بالعرض خسارته نسبية، أما اللي بيغطي شرايح بطولها بيخنق التيار.':'Thin film: strips run the module length, all in series. Shade across the strips costs proportionally; shade along whole strips chokes the current.');
  if(hotT>85) out.push(ar?`Hot spot ${fmt(hotT,0)}°C: الخلية بتبدد ${fmt(hot.Pd,1)} W عند ${fmt(hot.V,1)} V. فوق 85°C الـ EVA والـ backsheet في خطر، وفوق 120°C فيه browning وحرق.`:`Hot spot ${fmt(hotT,0)}°C: the cell dissipates ${fmt(hot.Pd,1)} W at ${fmt(hot.V,1)} V. Above 85°C the encapsulant and backsheet are at risk; above 120°C expect browning and burn marks.`);
  if(S.ctx==='iso'&&anyShade&&T.kind==='csi') out.push(ar?'جرّب "جوه المصفوفة": الاسترينج بيفرض تيار أعلى على اللوح المظلل، والـ hot spot بيبان أكتر.':'Switch to "In array": the string forces a higher current through the shaded module and the hot spot gets worse.');
  if(m.defect.includes(2)) out.push(ar?'خلية شنت: بتسرّب تيار داخلي وتسخن حتى من غير ظل، وتأثيرها أكبر في الإشعاع الواطي.':'Shunted cell: leaks current internally and heats even without shade, worst at low irradiance.');
  if(m.defect.includes(1)) out.push(ar?'الشرخ بيعزل جزء من الخلية فيقل تيارها، فبتتصرف زي خلية مظللة دايماً.':'A crack isolates part of the cell, so it acts like a permanently shaded cell.');
  if(m.defect.includes(3)) out.push(ar?'Rs عالي: الـ FF بيقل والخلية بتسخن بـ I²R.':'High Rs lowers FF and heats the cell by I²R.');
  if(tL>2) out.push(ar?`الحرارة لوحدها شايلة ${fmt(tL,1)}% من القدرة (γ = ${T.gP}%/°C). ارفع حرارة الجو وشوف الإطار بيحمر والفولت بيقل.`:`Temperature alone costs ${fmt(tL,1)}% (γ = ${T.gP}%/°C). Raise the ambient and watch the frame turn red and the voltage drop.`);
  if(T.kind==='csi'&&anyShade){ const bottom=[...m.shade.slice((T.rows-1)*T.cols)].every(x=>x>0.5);
    if(T.Np===2) out.push(ar?`Half-cut: النص العلوي والسفلي على التوازي جوه كل substring، فظل الصف السفلي بيأثر على النص السفلي بس${bottom?' — جرّب "Full cell" بنفس الظل وقارن.':'.'}`:`Half-cut: top and bottom halves are in parallel inside each substring, so a bottom-row shadow only hits the bottom half${bottom?' — switch to "Full cell" with the same shadow and compare.':'.'}`);
    else out.push(ar?'Full cell: كل الخلايا في الـ substring على التوالي، فخلية واحدة مظللة بتحدد تيار الـ substring كله. ظل صف سفلي بيقفل التلات substrings مرة واحدة.':'Full cell: every cell in a substring is in series, so one shaded cell limits the whole substring. A bottom-row shadow takes out all three substrings at once.'); }
  if(S.src==='loc'){ const sw=tiltSweep(T), ia=sw.ann.reduce((b,v,i)=>v>sw.ann[b]?i:b,0), cur=yearEnergy(T,S.loc.lat,S.loc.tilt,S.loc.az,S.env.Tamb)/(T.Pmax/1000), pc=cur/sw.ann[ia]*100;
    out.push(ar?`عند ميل ${S.loc.tilt}° واتجاه ${S.loc.az}° اللوح بيدي ${fmt(pc,1)}% من أفضل إنتاج سنوي. أفضل ميل هنا حوالي ${sw.tilts[ia]}° (قريب من خط العرض ${fmt(S.loc.lat,1)}°).`:`At ${S.loc.tilt}° tilt and ${S.loc.az}° azimuth the module gives ${fmt(pc,1)}% of the best annual yield. The best tilt here is about ${sw.tilts[ia]}° (close to the ${fmt(S.loc.lat,1)}° latitude).`); }
  if(S.env.Grear>0) out.push(T.bif>0?(ar?`Bifacial: الخلفي بيضيف ${fmt(T.bif*S.env.Grear,0)} W/m² مكافئ.`:`Bifacial: the rear adds ${fmt(T.bif*S.env.Grear,0)} W/m² equivalent.`):(ar?'اللوح monofacial، الإشعاع الخلفي مالوش تأثير.':'Monofacial module: rear irradiance has no effect.'));
  return out;
}

    series:[{x:b.x,y:b.y,c:ca,w:1.1,dash:[4,4]},{x:b.x,y:b.p,c:cp,w:1.1,dash:[4,4],ax:'y2'},{x:a.x,y:a.p,c:cp,w:2.2,ax:'y2',fill:'rgba(255,162,61,.12)'},{x:a.x,y:a.y,c:ca,w:2.4}],marks});

const sizeCache={};
function hotVmp(T,Tc){ const k=T.id+T.Pmax+'|'+Tc; if(sizeCache[k]) return sizeCache[k]; const e=new Engine(T,{G:1000,Tfix:Tc}); return sizeCache[k]=e.module(e.newModule()).mpp; }
function sizing(){
  const T=R.T, I=S.inv, ar=S.lang==='ar';
  const vocCold=T.Voc*(1+T.bVoc/100*(I.tmin-25)), tHot=I.tmax+(T.noct-20)/800*1000, vmpHot=hotVmp(T,Math.round(tHot)).V;
  const nMax=Math.floor(I.vdc/vocCold), nMin=Math.ceil(I.vmin/vmpHot), lens=S.strings.map(s=>s.length), L=Math.max(...lens), Lm=Math.min(...lens);
  const line=(ok,txt)=>`<div class="${ok===true?'pass':ok===false?'fail':'caution'}">${ok===true?'✓':ok===false?'✕':'!'} ${txt}</div>`;
  let h=line(L*vocCold<=I.vdc, ar?`Voc@${I.tmin}°C = ${fmt(vocCold,2)} V → ${L} لوح = ${fmt(L*vocCold,0)} V (حد ${I.vdc})`:`Voc@${I.tmin}°C = ${fmt(vocCold,2)} V → ${L} mod = ${fmt(L*vocCold,0)} V (limit ${I.vdc})`);
  h+=line(Lm*vmpHot>=I.vmin, ar?`Vmp@${fmt(tHot,0)}°C = ${fmt(vmpHot,2)} V → ${Lm} لوح = ${fmt(Lm*vmpHot,0)} V (أدنى ${I.vmin})`:`Vmp@${fmt(tHot,0)}°C = ${fmt(vmpHot,2)} V → ${Lm} mod = ${fmt(Lm*vmpHot,0)} V (min ${I.vmin})`);
  h+=line(nMin<=nMax, ar?`الطول المسموح: ${nMin} – ${nMax} لوح`:`Allowed length: ${nMin} – ${nMax} modules`);
  if(L!==Lm) h+=line(null, ar?'أطوال مختلفة على نفس الـ MPPT = ميسماتش.':'Unequal lengths on one MPPT = mismatch.');
  if(R.clipped) h+=line(null, ar?'الـ MPP برا نافذة الـ MPPT.':'True MPP lies outside the MPPT window.');
  $('sizing').innerHTML=h;
}
function arrayInsights(T,mis,po){
  const ar=S.lang==='ar', out=[];

function cmpTemp(ids){ const Ts=[]; for(let x=0;x<=85;x+=5) Ts.push(x);
  return ids.map(id=>{ const T=TECHS[id], e=new Engine(T,{G:1000,Tfix:25}), p25=e.module(e.newModule()).mpp.P;
    return {id,x:Ts,y:Ts.map(tc=>{ e.setEnv({G:1000,Tfix:tc}); return e.module(e.newModule()).mpp.P/p25*100; })}; }); }
function cmpShade(ids){ return ids.map(id=>{ const T=TECHS[id], e=new Engine(T,{G:1000,Tfix:25}), p0=e.module(e.newModule()).mpp.P;
  return Object.keys(PRESETS).map(cs=>{ const m=e.newModule(); m.shade=presetShade(T,cs); const r=e.module(m), tr=e.trace(r,T.Imp);
    return {loss:(1-r.mpp.P/p0)*100,hot:Math.max(...tr.cells.map(c=>c.Th)),byp:tr.subs.filter(s=>s.bypass).length}; }); }); }
function cmpDay(ids){
  const D=S.day==='as'?{tmin:29,tmax:44,sr:5.9,ss:18.9,gp:1010}:{tmin:10,tmax:21,sr:6.8,ss:17.2,gp:760};

  const day=ids.map(id=>{ const T=TECHS[id], e=new Engine(T,{G:1000,Tfix:25}); let E=0,E25=0,peakT=0; const y=[];
    hrs.forEach(h=>{ const s=(h-D.sr)/(D.ss-D.sr), G=s>0&&s<1?D.gp*Math.pow(Math.sin(Math.PI*s),1.25):0;
      const Ta=D.tmin+(D.tmax-D.tmin)*Math.max(0,Math.sin(Math.PI*(h-8)/14)), Tc=Ta+(T.noct-20)/800*G; let p=0,p25=0;
      if(G>5){ const Gq=Math.round(G/5)*5; e.setEnv({G:Gq,Tfix:Math.round(Tc)}); p=e.module(e.newModule()).mpp.P; e.setEnv({G:Gq,Tfix:25}); p25=e.module(e.newModule()).mpp.P; peakT=Math.max(peakT,Tc); }
      y.push(p/T.Pmax); E+=p/T.Pmax*0.25; E25+=p25/T.Pmax*0.25; });
    return {id,y,E,loss:(1-E/E25)*100,peakT}; });

}
